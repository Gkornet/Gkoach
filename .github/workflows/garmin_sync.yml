# .github/workflows/garmin_sync.yml
# ─────────────────────────────────────────────────────────────────────────────
# Draait elk uur (GitHub Actions gebruikt altijd UTC)
# TZ=Europe/Amsterdam zorgt dat de Python-code de juiste dag gebruikt
# ─────────────────────────────────────────────────────────────────────────────

name: Garmin Daily Sync

on:
  schedule:
    - cron: '0 * * * *'   # elk uur
  workflow_dispatch:  # Handmatig triggeren via GitHub UI of API
    inputs:
      date:
        description: 'Datum om te syncen (YYYY-MM-DD). Leeg = vandaag.'
        required: false
        default: ''

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Europe/Amsterdam   # Zorgt dat datetime.date.today() Amsterdam-tijd geeft

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Python instellen
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Dependencies installeren
        run: pip install -r backend/requirements.txt

      - name: Garmin tokens herstellen (cache)
        uses: actions/cache@v5
        with:
          path: backend/.garmin_tokens
          key: garmin-tokens-${{ github.run_id }}
          restore-keys: |
            garmin-tokens-

      - name: Garmin tokens herstellen vanuit Secret
        run: |
          if [ -n "$GARMIN_TOKENS" ]; then
            echo "$GARMIN_TOKENS" | base64 -d | tar -xz -C .
            echo "  ✓ Tokens hersteld vanuit Secret"
            ls backend/.garmin_tokens/ || echo "  ⚠ Token dir leeg"
          fi
        env:
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}

      - name: Garmin sync uitvoeren
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GARMIN_USER_ID: ${{ secrets.GARMIN_USER_ID }}
          SYNC_DATE: ${{ github.event.inputs.date }}
        run: |
          cd backend
          python garmin_sync.py

      - name: Tokens opslaan voor morgen
        if: always()
        uses: actions/cache/save@v5
        with:
          path: backend/.garmin_tokens
          key: garmin-tokens-${{ github.run_id }}
