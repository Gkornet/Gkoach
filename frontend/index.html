<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- "default" laat iOS de statusbalk zelf inkleuren; dat werkt in zowel
         lichte als donkere modus, anders zou witte statusbalktekst op een
         lichte achtergrond onleesbaar zijn. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- Systeemkleuren van iOS: wordt door de app bijgewerkt bij een thema-wissel -->
    <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-title" content="Gkoach" />
    <title>Gkoach</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <style>
      /* De shell volgt de systeeminstelling, zodat er bij het opstarten geen
         donkere flits verschijnt in lichte modus (en andersom). */
      :root { color-scheme: light dark; }
      html, body { margin: 0; background: #F2F2F7; }
      @media (prefers-color-scheme: dark) {
        html, body { background: #000000; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
